      (function() {
        const theme = localStorage.getItem('dipwise_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {

        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
